<script>
"use strict";

const SUPABASE_URL = "https://jwcrxijwqldrqcdnqbji.supabase.co";
const SUPABASE_KEY = "sb_publishable_XZMtGlBdoca4TVZEUrWgbw_Hotuw_uD";

  const BUCKET = "dlg-attachments";
const AVATAR_BUCKET = BUCKET;

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

  let me = null, myProfile = null, people = [], selected = null;
let messagesForDelete = [];


  let currentTab = "contacts", loadingPeople = false, replyMessage = null;

let refreshTimer = null, messageBusy = false;

  let groups = [];

function say(id, text) { $(id).textContent = text || ""; }
function errorText(e) { return e?.message || String(e || "Erreur inconnue"); }
function initials(s) { return (s || "?").trim().charAt(0).toUpperCase(); }

/* PHOTO DE PROFIL DIALOGUE */

const avatarCache = new Map();



async function showAvatar(element, name, path) {
  if (!element) return;

  element.replaceChildren();

  if (!path) {
    element.textContent = initials(name);
    return;
  }

  try {
    const { data, error } = await db.storage
      .from("dlg-attachments")
      .createSignedUrl(path, 3600);

    if (error) throw error;

    const img = document.createElement("img");
    img.alt = "Photo de profil";
    img.src = data.signedUrl;
    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "cover";
    img.style.borderRadius = "50%";

    img.onerror = () => {
      element.replaceChildren();
      element.textContent = initials(name);
      console.error("Impossible d'afficher la photo.");
    };

    element.replaceChildren(img);
  } catch (e) {
    element.replaceChildren();
    element.textContent = initials(name);
    console.error("Erreur photo :", e.message);
  }
}



async function changeProfilePhoto(file) {
  if (!me || !myProfile || !file) {
    alert("Connectez-vous d'abord.");
    return;
  }

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("Choisissez une image JPG, PNG ou WEBP.");
    return;
  }

  if (file.size > 1024 * 1024) {
    alert("Choisissez une image de moins de 1 MB.");
    return;
  }

  const btn = $("addMyPhoto");
  btn.disabled = true;

  let path = null;

  try {
    const ext = file.type === "image/png" ? "png" :
                file.type === "image/webp" ? "webp" : "jpg";

    path = "avatars/" + me.id + "/profile_" +
           Date.now() + "." + ext;

    const { error: uploadError } = await db.storage
      .from("dlg-attachments")
      .upload(path, file, {
        contentType: file.type,
        upsert: false
      });

    if (uploadError) throw uploadError;

    const { data, error: updateError } = await db
      .from("dlg_profiles")
      .update({ avatar_url: path })
      .eq("user_id", me.id)
      .select("user_id,username,full_name,created_at,avatar_url")
      .maybeSingle();

    if (updateError) throw updateError;

    if (!data) {
      throw new Error(
        "Profil introuvable ou modification refusée. Vérifiez user_id et les permissions."
      );
    }

    myProfile = data;

    $("myProfileName").textContent =
      data.full_name || data.username || "Mon profil";

    await showAvatar(
      $("myAvatar"),
      $("myProfileName").textContent,
      data.avatar_url
    );

    avatarCache.clear();
    await loadPeople(true);

    alert("Photo enregistrée dans votre profil !");
  } catch (e) {
    console.error("Erreur photo profil :", e);
    alert("Impossible d'enregistrer la photo : " + errorText(e));
  } finally {
    btn.disabled = false;
    $("profilePhotoInput").value = "";
  }
}


  





/* GUKURAKO IFOTO YA PROFIL YAWE */


async function removeMyPhoto() {
  if (!me || !myProfile) {
    alert("Connectez-vous d'abord.");
    return;
  }

  if (!myProfile.avatar_url) {
    alert("Nta foto ya profil ufise.");
    return;
  }

  if (!confirm("Voulez-vous retirer votre photo de profil ?")) {
    return;
  }

  const btn = $("removeMyPhoto");
  btn.disabled = true;

  try {
    const oldPath = myProfile.avatar_url;

    const { data, error } = await db
      .from("dlg_profiles")
      .update({ avatar_url: null })
      .eq("user_id", me.id)
      .select("user_id,username,full_name,created_at,avatar_url")
      .single();

    if (error) throw error;

    myProfile = data;
    avatarCache.clear();

    const name = myProfile.full_name || myProfile.username || "Mon profil";

    $("myProfileName").textContent = name;
    await showAvatar($("myAvatar"), name, null);

    if (selected && selected.id === me.id) {
      await showAvatar($("chatAvatar"), name, null);
    }

    await loadPeople(true);

    // Gusiba ifoto muri bucket yarimwo
    const oldBucket = oldPath.startsWith("avatars/")
      ? BUCKET
      : AVATAR_BUCKET;

    const { error: storageError } = await db.storage
      .from(oldBucket)
      .remove([oldPath]);

    if (storageError) {
      console.warn("Suppression du fichier :", storageError.message);
    }

    alert("Votre photo de profil a été retirée.");
  } catch (e) {
    alert("Erreur : " + errorText(e));
  } finally {
    btn.disabled = false;
  }
}







  
  

function openMyPhotoPicker() {
  if (!me || !myProfile) {
    alert("Connectez-vous d'abord.");
    return;
  }

  $("menu").style.display = "none";
  $("profilePhotoInput").click();
}

$("photoProfileBtn").onclick = openMyPhotoPicker;
$("addMyPhoto").onclick = openMyPhotoPicker;
  $("removeMyPhoto").onclick = removeMyPhoto;
  

$("profilePhotoInput").addEventListener("change", async () => {
  const file = $("profilePhotoInput").files?.[0];
  if (file) await changeProfilePhoto(file);
});

  
function timeText(s) {
 return s ? new Date(s).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "";
}
function showApp() { $("auth").style.display="none"; $("app").style.display="block"; }
function showAuth() { $("auth").style.display="block"; $("app").style.display="none"; }
function escapeText(s) { return String(s || ""); }

async function getMe() {
 const {data,error} = await db.auth.getSession();
 if(error) throw error;
 me = data.session?.user || null;
 return me;
}

async function login() {
 const email=$("email").value.trim(), password=$("password").value;
 if(!email || !password) return say("authMsg","Entrez votre email et votre mot de passe.");
 say("authMsg","Connexion...");
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error) return say("authMsg",errorText(error));
 me=data.user;
 await startApp();
}

async function signup() {
 const email=$("email").value.trim(), password=$("password").value;
 if(!email || password.length<6)
  return say("authMsg","Entrez un email valide et un mot de passe de 6 caractères minimum.");
 say("authMsg","Création du compte...");
 const {data,error}=await db.auth.signUp({email,password});
 if(error) return say("authMsg",errorText(error));
 if(!data.session) {
  say("authMsg","Compte créé. Vérifiez votre email si la confirmation est activée, puis connectez-vous.");
  return;
 }
 me=data.user;
 await startApp();
}

async function ensureProfile() {
  const { data, error } = await db
    .from("dlg_profiles")
    .select("user_id,username,full_name,created_at,avatar_url")
    .eq("user_id", me.id)
    .maybeSingle();

  if (error) throw error;

  if (data) {
    myProfile = data;
    return;
  }

  const base = (me.email || "user").split("@")[0];

  const { data: created, error: e } = await db
    .from("dlg_profiles")
    .insert({
      user_id: me.id,
      username: base + "_" + me.id.slice(0, 5),
      full_name: base,
      avatar_url: null
    })
    .select("user_id,username,full_name,created_at,avatar_url")
    .single();

  if (e) throw e;

  myProfile = created;
}




  
async function markDeliveredMessages() {
  if (!me || document.hidden) return;

  const { data: memberships, error: memberError } =
    await db.from("dlg_conversation_members")
      .select("conversation_id")
      .eq("user_id", me.id);

  if (memberError) throw memberError;

  const ids = [...new Set(
    (memberships || []).map(x => x.conversation_id)
  )];

  if (!ids.length) return;

  const { error } = await db.from("dlg_messages")
    .update({ delivered_at: new Date().toISOString() })
    .in("conversation_id", ids)
    .neq("sender_id", me.id)
    .is("delivered_at", null);

  if (error) {
    console.warn("Confirmation de réception :", error.message);
  }
}




  
async function startApp() {
 try {
  showApp();
  say("status","Chargement du profil...");
await ensureProfile();

$("myProfileName").textContent =
  myProfile.full_name || myProfile.username || "Mon profil";

await showAvatar(
  $("myAvatar"),
  myProfile.full_name || myProfile.username,
  myProfile.avatar_url
);

await loadPeople();

  
  if(refreshTimer) clearInterval(refreshTimer);


refreshTimer = setInterval(async () => {
  if (!me || document.hidden) return;

  try {
    await markDeliveredMessages();
    await loadPeople(true);

    if (selected) {
      await loadMessages(true);
    }
  } catch (e) {
    console.warn("Actualisation :", e.message);
  }
}, 6000);


  
 } catch(e) { say("status","Erreur : "+errorText(e)); }
}

/* Contacts et conversations existantes */


/* Contacts, discussions et groupes */
async function loadPeople(silent = false) {
  if (!me || loadingPeople) return;

  loadingPeople = true;

  if (!silent) say("status", "Chargement...");

  try {
    // 1. Charger les profils des autres utilisateurs

async function loadGroups() {

    groups = [];
    return;

  const { data, error } = await db.from("dlg_conversations")
    .select("id,name,avatar_url,created_by,is_group")
    .in("id", ids)
    .eq("is_group", true)

async function createGroup() {
  if (!me) return;

  if (!people.length) {
    alert("Il faut d'abord avoir d'autres utilisateurs inscrits.");
    return;
  }

  const name = prompt("Nom du groupe :");
  if (name === null || !name.trim()) return;

  const choices = people.map((p, i) =>
    `${i + 1}. ${p.name} (@${p.username})`
  ).join("\n");

  const answer = prompt(
    "Entrez les numéros des membres, séparés par des virgules.\n\n" +
    choices + "\n\nExemple : 1,2"
  );

  if (answer === null) return;

  const memberIds = [...new Set(
    answer.split(",")
      .map(x => Number(x.trim()))
      .filter(n => Number.isInteger(n) && n >= 1 && n <= people.length)
      .map(n => people[n - 1].id)
      .filter(id => id !== me.id)
  )];

  try {
    say("status", "Création du groupe...");

    const { data, error } = await db.rpc("dlg_create_group", {
      p_name: name.trim(),
      p_member_ids: memberIds
    });

    if (error) throw error;

    const conversationId = typeof data === "string" ? data : data?.id;
    if (!conversationId) {
      throw new Error("Identifiant du groupe introuvable.");
    }

    await loadGroups();
    renderPeople();

    const group = groups.find(g => g.id === conversationId);
    if (group) {
      await openChat({
        id: group.id,
        name: group.name,
        username: "",
        conversationId: group.id,
        isGroup: true
      });
    }

    say("status", "");
  } catch (e) {
    alert("Impossible de créer le groupe : " + errorText(e));
    say("status", "");
  }
}

async function getAttachmentMap(ids) {
 if(!ids.length) return new Map();
 const {data,error}=await db.from("dlg_attachments")
  .select("message_id,file_name,mime_type,file_size_bytes,storage_path")
  .in("message_id",ids);
 if(error) throw error;
 const map=new Map();
 for(const f of data||[]) map.set(f.message_id,f);
 return map;
}

/* Messages, fichiers, réactions et reçus */

     
async function loadMessages(silent = false) {
  const chat = selected;
  if (!chat?.conversationId || !me) return;

  const area = $("messages");

  try {
    const { data: msgs, error } = await db
      .from("dlg_messages")
      .select("*")
      .eq("conversation_id", chat.conversationId)
      .order("created_at", { ascending: true })
      .limit(200);

    if (error) throw error;
    if (selected !== chat) return;

    messagesForDelete = msgs || [];

    const ids = msgs.map(m => m.id);
    const files = await getAttachmentMap(ids);

    area.replaceChildren();

    if (!msgs.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Aucun message. Envoyez le premier !";
      area.append(empty);
      return;
    }

    for (const m of msgs) {
      const bubble = document.createElement("div");
      bubble.className =
        "bubble" + (m.sender_id === me.id ? " mine" : "");

      if (m.reply_to) {
        const original = msgs.find(x => x.id === m.reply_to);
        const quote = document.createElement("div");
        quote.className = "replyquote";
        quote.textContent = "↩ Réponse à : " +
          (original?.body || "Pièce jointe");
        bubble.append(quote);
      }

      const body = document.createElement("div");
      const attachment = files.get(m.id);

      if (attachment) {
        const { data, error: signError } = await db.storage
          .from(BUCKET)
          .createSignedUrl(attachment.storage_path, 3600);

        if (signError) {
          body.textContent = attachment.file_name +
            " — fichier inaccessible";
        } else {
          const url = data.signedUrl;
          const mime = attachment.mime_type || "";

          if (mime.startsWith("image/")) {
            const img = document.createElement("img");
            img.src = url;
            img.alt = attachment.file_name;
            img.loading = "lazy";
            bubble.append(img);
          } else if (mime.startsWith("video/")) {
            const video = document.createElement("video");
            video.src = url;
            video.controls = true;
            video.preload = "none";
            video.playsInline = true;
            bubble.append(video);
          } else if (mime.startsWith("audio/")) {
            const audio = document.createElement("audio");
            audio.src = url;
            audio.controls = true;
            audio.preload = "none";
            bubble.append(audio);
          }

          const link = document.createElement("a");
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = "📎 " + attachment.file_name;
          body.append(link);
        }
      } else {
        body.textContent = m.body || "";
      }

      bubble.append(body);

      const time = document.createElement("time");
      time.textContent = timeText(m.created_at);

      if (m.sender_id === me.id) {
        const receipt = document.createElement("span");
        receipt.className = "receipt";
        receipt.textContent = m.read_at
          ? " ✓✓"
          : m.delivered_at ? " ✓✓" : " ✓";
        time.append(receipt);
      }

      bubble.append(time);

      const tools = document.createElement("div");
      tools.className = "msgtools";

      const reply = document.createElement("button");
      reply.type = "button";
      reply.textContent = "↩ Répondre";
      reply.onclick = () => {
        replyMessage = m;
        $("replyText").textContent =
          "Réponse à : " + (m.body || "Pièce jointe").slice(0, 100);
        $("replyBox").hidden = false;
        $("messageInput").focus();
      };
      tools.append(reply);

      if (m.sender_id === me.id) {
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "🗑 Supprimer";
        del.onclick = () => deleteMessage(m.id);
        tools.append(del);
      }

      bubble.append(tools);

      // IYI NIYO MIRONGO YARI IBUZE:
      // Kwongerako ubutumwa muri zone ibwerekana.
      area.append(bubble);
    }

    area.scrollTop = area.scrollHeight;

    const unread = msgs.filter(
      m => m.sender_id !== me.id && !m.read_at
    );

    if (unread.length) {
      const { error } = await db
        .from("dlg_messages")
        .update({ read_at: new Date().toISOString() })
        .in("id", unread.map(m => m.id))
        .neq("sender_id", me.id);

      if (error) {
        console.warn("Confirmation de lecture :", error.message);
      }
    }
  } catch (e) {
    console.error("loadMessages :", e);
    if (!silent && selected === chat) {
      area.replaceChildren();
      const errorBox = document.createElement("div");
      errorBox.className = "empty";
      errorBox.textContent =
        "Erreur de chargement : " + errorText(e);
      area.append(errorBox);
    }
    throw e;
  }
}




/* SUPPRIMER UN MESSAGE PERSONNEL */

async function deleteMessage(messageId) {
  if (!me || !selected || !messageId) {
    alert("Message introuvable.");
    return;
  }

  const message = messagesForDelete.find(
    m => m.id === messageId
  );

  if (!message) {
    alert("Message introuvable. Actualisez la discussion.");
    return;
  }

  if (message.sender_id !== me.id) {
    alert("Vous pouvez supprimer uniquement vos propres messages.");
    return;
  }

  if (!confirm("Voulez-vous supprimer ce message ?")) {
    return;
  }

  try {
    const { data, error } = await db
      .from("dlg_messages")
      .delete()
      .eq("id", messageId)
      .eq("sender_id", me.id)
      .select("id");

    if (error) throw error;

    if (!data || data.length === 0) {
      alert("Suppression impossible. Vérifiez les permissions Supabase.");
      return;
    }

    await loadMessages();
    await loadPeople(true);

  } catch (e) {
    alert("Erreur de suppression : " + errorText(e));
  }
}

/* Fichiers : 20 MB maximum par fichier */
async function sendAttachment(file) {
 if(!me || !selected?.conversationId) {
  alert("Banza ufungure discussion."); return;
 }
 if(file.size>20*1024*1024) {
  alert("Fichier irengeje 20 MB."); return;
 }
 const chat=selected;
 const type=file.type.startsWith("image/")?"image":
  file.type.startsWith("video/")?"video":
  file.type.startsWith("audio/")?"audio":"file";
 $("chatstatus").textContent="Envoi du fichier...";
 ["fileBtn","photoBtn","audioBtn","videoBtn"].forEach(id=>$(id).disabled=true);

 let messageId=null, path=null;
 try {
  const {data:msg,error:msgError}=await db.from("dlg_messages").insert({
   conversation_id:chat.conversationId,sender_id:me.id,
   body:file.name,message_type:type
  }).select("id").single();
  if(msgError) throw msgError;
  messageId=msg.id;

  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_").slice(-100);
  path=chat.conversationId+"/"+messageId+"_"+safeName;

  const {error:upError}=await db.storage.from(BUCKET).upload(path,file,{
   contentType:file.type||"application/octet-stream",upsert:false
  });
  if(upError) throw upError;

  const {error:attError}=await db.from("dlg_attachments").insert({
   message_id:messageId,uploaded_by:me.id,file_name:file.name,
   mime_type:file.type||"application/octet-stream",
   file_size_bytes:file.size,storage_path:path
  });
  if(attError) throw attError;

  $("chatstatus").textContent="Connecté";
  if(selected===chat) await loadMessages();
  await loadPeople(true);
 } catch(e) {
  console.error(e);
  alert("Erreur d'envoi : "+errorText(e)+
   "\nVérifiez le bucket dlg-files, ses policies et les colonnes de dlg_attachments.");
  $("chatstatus").textContent="Erreur d'envoi";
 } finally {
  ["fileBtn","photoBtn","audioBtn","videoBtn"].forEach(id=>$(id).disabled=false);
 }
}

 if(!me||!myProfile) return;
 const name=prompt("Votre nom :",myProfile.full_name||"");
 if(name===null||!name.trim()) return;

const {data,error}=await db
  .from("dlg_profiles")
  .update({full_name:name.trim()})
  .eq("user_id",me.id)
  .select("user_id,username,full_name,created_at,avatar_url")
  .single();

  if(error) return alert(errorText(error));

myProfile = data;

$("myProfileName").textContent =
  myProfile.full_name || myProfile.username || "Mon profil";

await showAvatar(
  $("myAvatar"),
  myProfile.full_name || myProfile.username,
  myProfile.avatar_url
);

await loadPeople(true);

$("chatname").textContent =
  selected?.name || "Dialogue";
  
    };

$("logoutBtn").onclick=async()=>{
 if(refreshTimer) clearInterval(refreshTimer);
 const {error}=await db.auth.signOut();
 if(error) return alert(errorText(error));
 me=null; selected=null; people=[]; myProfile=null;
 showAuth();
};
$("backBtn").onclick=()=>{
 $("people").style.display="block";
 if(innerWidth<650) $("chat").style.display="none";
 selected=null;
};
document.querySelectorAll(".tabs button").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); currentTab=btn.dataset.tab; renderPeople();
 };
});
window.addEventListener("resize",()=>{
 if(innerWidth>=650) {
  $("people").style.display="block";
  $("chat").style.display="flex";
 } else if(!selected) $("chat").style.display="none";
});
db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT") {
  me=null; selected=null;
  if(refreshTimer) clearInterval(refreshTimer);
  showAuth();
 }
});

(async()=>{
 try {
  if(!SUPABASE_KEY.startsWith("sb_publishable_")) {
   say("authMsg","Vérifiez la clé publique Supabase."); return;
  }
  await getMe();
  if(me) await startApp();
 } catch(e) { say("authMsg",errorText(e)); }
})();



</script>
</body>
</html>
