<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>kuraba rapport canke ukayisohora ukayibika</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    padding:20px;
}

h1{
    text-align:center;
    color:#0066cc;
}

.container{
    background:white;
    padding:20px;
    border-radius:10px;
}

input, button{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:5px;
}

input{
    border:1px solid #aaa;
}

button{
    background:#0066cc;
    color:white;
    border:none;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #aaa;
    padding:8px;
    text-align:center;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin-top:15px;
}
</style>
</head>

<body>

<h1>Rapport Maison Informatique</h1>

<div class="container">

<label>Igikorwa:</label>
<input type="text" id="nom" placeholder="Ex: Vente logiciel">

<label>Amafaranga yinjiye:</label>
<input type="number" id="entree" placeholder="0">

<label>Amafaranga yasohotse:</label>
<input type="number" id="sortie" placeholder="0">

<button onclick="saveRapport()">Bika Rapport</button>

<button onclick="window.print()">Imprimer PDF / Ordinateur</button>


<table>
<tr>
<th>Itariki</th>
<th>Igikorwa</th>
<th>Yinjiye</th>
<th>Yasohotse</th>
</tr>

<tbody id="liste"></tbody>

</table>


<div class="total">
Amafaranga asigaye: <span id="solde">0</span>
</div>

</div>


<script>

let rapports = JSON.parse(localStorage.getItem("rapports")) || [];


function saveRapport(){

let nom = document.getElementById("nom").value;
let entree = Number(document.getElementById("entree").value);
let sortie = Number(document.getElementById("sortie").value);


let rapport = {
date:new Date().toLocaleDateString(),
nom:nom,
entree:entree,
sortie:sortie
};


rapports.push(rapport);

localStorage.setItem("rapports", JSON.stringify(rapports));


afficher();

document.getElementById("nom").value="";
document.getElementById("entree").value="";
document.getElementById("sortie").value="";

}



function afficher(){

let liste = document.getElementById("liste");
liste.innerHTML="";

let totalEntree=0;
let totalSortie=0;


rapports.forEach(r=>{

liste.innerHTML += `
<tr>
<td>${r.date}</td>
<td>${r.nom}</td>
<td>${r.entree}</td>
<td>${r.sortie}</td>
</tr>
`;

totalEntree += r.entree;
totalSortie += r.sortie;

});


document.getElementById("solde").innerHTML =
totalEntree - totalSortie;

}


afficher();

</script>

</body>
</html>
