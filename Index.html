<!DOCTYPE html>
<html lang="rn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion Association</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
    padding:20px;
}

h1{
    text-align:center;
    color:green;
}

.container{
    background:white;
    padding:20px;
    border-radius:10px;
}

input,button{
    width:100%;
    padding:10px;
    margin:5px 0;
}

button{
    background:green;
    color:white;
    border:none;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

  .table-container{
    width:100%;
    overflow-x:auto;
}

table{
    min-width:600px;
}

th,td{
    border:1px solid #aaa;
    padding:8px;
}
  .date-rapport{
    font-style: italic;
    font-size: 16px;
    color: #555;
    margin-top: 10px;
    text-align: center;
  }

</style>

</head>


<body>

<div id="login">

<h2>Connexion</h2>

<input id="username" placeholder="Nom y'ukoresha">

<input id="password" type="password" placeholder="Mot de passe">

<button onclick="connexion()">Entrer</button>

<p id="message"></p>

</div>

<!-- aha ni ho code yawe yose isanzwe iguma -->
  




<div class="container" id="app" style="display:none;">
  

<div id="produitPanel">
<h2>Gestion Stock</h2>
...
</div>


<div id="membrePanel">
...
</div>

<div id="cotisationPanel">

<h2>Kwiyandikisha kw'umunyamuryango</h2>


<input id="izina" placeholder="Izina ry'umunyamuryango">


<input id="telephone" placeholder="Numero ya telefone">


<input id="ukwezi" placeholder="Ukwezi yishuye (akarorero: Kanama 2026)">


<input id="amafaranga" type="number" placeholder="Amafaranga yishuye">


<button onclick="bikaCotisation()">
Bika ubwishyu
</button>

</div>



<div id="membreRapport">

<h2>Abanyamuryango bishuye</h2>


<div class="table-container">

<table>

<thead>
<tr>
<th>Izina</th>
<th>Telephone</th>
<th>Ukwezi</th>
<th>Amafaranga</th>
</tr>
</thead>

<tbody id="liste">
</tbody>

</table>

</div>


  <h2>Rondera umunyamuryango</h2>

<input id="search" placeholder="Andika izina">

<button onclick="shakaUmunyamuryango()">
Rondera
</button>


<div id="resultSearch"></div>
  </div>
  <h2>Gestion Stock</h2>

<input id="produit" placeholder="Izina ry'igicuruzwa">

<input id="quantite" type="number" placeholder="Ingano yinjiye">

<input id="prixAchat" type="number" placeholder="Amafaranga vyaguzwe">


<button onclick="bikaStock()">
Bika Stock
</button>



<h2>Igurisha</h2>


<input id="produitVendu" placeholder="Igicuruzwa cagurishijwe">

<input id="quantiteVendu" type="number" placeholder="Ingano yagurishijwe">

<input id="prixVente" type="number" placeholder="Amafaranga yagurishijwe">


<button onclick="bikaVente()">
Bika Igurisha
</button>



<div id="depensePanel">

<h2>Depense</h2>

...
</div>


<input id="montantDepense" type="number" placeholder="Amafaranga yasohotse">


<button onclick="bikaDepense()">
Bika Depense
</button>
  <div id="rapportPanel">

<h2>Rapport Rusangi</h2>

...
  </div>

<button onclick="rabaRapport()">
Raba Rapport
</button>

<div id="dateRapport" class="date-rapport"></div>
<div id="rapport"></div>
  <div id="total"></div>

<button onclick="imprimerRapport()">
    Imprimer le rapport
</button>

<button onclick="oherezaWhatsApp()">WhatsApp</button>


</div>

</div>

<script>


let cotisations =
JSON.parse(localStorage.getItem("cotisations")) || [];



// KUBIKA UMWISHYU


function bikaCotisation(){


let membre={


izina:
document.getElementById("izina").value,


telephone:
document.getElementById("telephone").value,


ukwezi:
document.getElementById("ukwezi").value,


amafaranga:
Number(document.getElementById("amafaranga").value)


};



cotisations.push(membre);



localStorage.setItem(
"cotisations",
JSON.stringify(cotisations)
);



erekana();



document.getElementById("izina").value="";
document.getElementById("telephone").value="";
document.getElementById("ukwezi").value="";
document.getElementById("amafaranga").value="";


}



// KWEREKANA ABISHUYE


function erekana(){


let resultat="";


cotisations.forEach(function(m){


resultat += `

<tr>

<td>${m.izina}</td>

<td>${m.telephone}</td>

<td>${m.ukwezi}</td>

<td>${m.amafaranga}</td>

</tr>

`;


});


document.getElementById("liste").innerHTML=resultat;


}



// KWEREKANA UBWA MBERE

erekana();
  function shakaUmunyamuryango(){


let izina =
document.getElementById("search").value.toLowerCase();


let amakuru="";


cotisations.forEach(function(m){


if(m.izina.toLowerCase().includes(izina)){


amakuru += `

<h3>Amakuru y'umunyamuryango</h3>

<p>
<b>Izina:</b> ${m.izina}<br>

<b>Telephone:</b> ${m.telephone}<br>

<b>Ukwezi yishuye:</b> ${m.ukwezi}<br>

<b>Amafaranga:</b> ${m.amafaranga}
</p>

<hr>

`;

}


});


if(amakuru==""){

amakuru="Nta munyamuryango abonetse";

}


document.getElementById("resultSearch").innerHTML=amakuru;
}
  // STOCK

let stocks =
JSON.parse(localStorage.getItem("stocks")) || [];


let ventes =
JSON.parse(localStorage.getItem("ventes")) || [];


let depenses =
JSON.parse(localStorage.getItem("depenses")) || [];




// KUBIKA STOCK

function bikaStock(){


let stock={

produit:
document.getElementById("produit").value,


quantite:
Number(document.getElementById("quantite").value),


prixAchat:
Number(document.getElementById("prixAchat").value)

};



stocks.push(stock);


localStorage.setItem(
"stocks",
JSON.stringify(stocks)
);



alert("Stock yabitswe");


}




// KUBIKA IGURISHA

function bikaVente(){


let vente={


produit:
document.getElementById("produitVendu").value,


quantite:
Number(document.getElementById("quantiteVendu").value),


prix:
Number(document.getElementById("prixVente").value)


};



ventes.push(vente);



localStorage.setItem(
"ventes",
JSON.stringify(ventes)
);



alert("Igurisha ryabitswe");


}





// KUBIKA DEPENSE


function bikaDepense(){

let montant = Number(document.getElementById("montantDepense").value);

if(isNaN(montant) || montant <= 0){
    alert("Shiramwo amafaranga ya depense");
    return;
}

let depense = {
    montant: montant
};

depenses.push(depense);

localStorage.setItem(
    "depenses",
    JSON.stringify(depenses)
);

document.getElementById("montantDepense").value="";

alert("Depense yabitswe");

  }

                    
  function rabaRapport(){

let amakuru = "";

let totalCotisation = 0;
let totalAchat = 0;
let totalVente = 0;
let totalDepense = 0;


// ABISHUYE

amakuru += `
<h3>Abanyamuryango bishuye</h3>

<table border="1" width="100%">
<tr>
<th>Izina</th>
<th>Ukwezi</th>
<th>Amafaranga</th>
</tr>
`;

cotisations.forEach(function(m){

amakuru += `
<tr>
<td>${m.izina}</td>
<td>${m.ukwezi}</td>
<td>${m.amafaranga} Fbu</td>
</tr>
`;

totalCotisation += Number(m.amafaranga || 0);



});

amakuru += `</table><br>`;



// STOCK

amakuru += `
<h3>Stock yinjiye</h3>

<table border="1" width="100%">
<tr>
<th>Igicuruzwa</th>
<th>Ingano</th>
<th>Amafaranga</th>
</tr>
`;

stocks.forEach(function(s){

amakuru += `
<tr>
<td>${s.produit}</td>
<td>${s.quantite}</td>
<td>${s.prixAchat} Fbu</td>
</tr>
`;

totalAchat += Number(s.prixAchat);

});

amakuru += `</table><br>`;




// IGURISHA

amakuru += `
<h3>Igurisha</h3>

<table border="1" width="100%">
<tr>
<th>Igicuruzwa</th>
<th>Ingano</th>
<th>Amafaranga</th>
</tr>
`;

ventes.forEach(function(v){

amakuru += `
<tr>
<td>${v.produit}</td>
<td>${v.quantite}</td>
<td>${v.prix} Fbu</td>
</tr>
`;

totalVente += Number(v.prix || 0);

});

amakuru += `</table><br>`;




// DEPENSE

amakuru += `
<h3>Depense</h3>

<table border="1" width="100%">
<tr>
<th>Amafaranga yasohotse</th>
</tr>
`;

depenses.forEach(function(d){

amakuru += `
<tr>
<td>${d.montant} Fbu</td>
</tr>
`;

totalDepense += Number(d.montant || 0);

});

amakuru += `</table><br>`;



// BILAN

let amafarangaAsigaye =
totalCotisation + totalVente - totalAchat - totalDepense;



amakuru += `

<h3>Rapport y'amafaranga</h3>

<p>
Amafaranga ya cotisation:
<b>${totalCotisation} Fbu</b>
</p>

<p>
Amafaranga y'igurisha:
<b>${totalVente} Fbu</b>
</p>

<p>
Depense:
<b>${totalDepense} Fbu</b>
</p>

<hr>

<h2>
Amafaranga asigaye:
${amafarangaAsigaye} Fbu
</h2>

`;


// SHIRIRA RAPPORT

document.getElementById("rapport").innerHTML = amakuru;


// DATE

let ubu = new Date();

document.getElementById("dateRapport").innerHTML =
"Rapport yasohotse: " +
ubu.toLocaleDateString() +
" - Isaha: " +
ubu.toLocaleTimeString();


  }



// Button Imprimer
  function imprimerRapport(){

    let contenu = document.getElementById("rapport").innerHTML;
    let date = document.getElementById("dateRapport").innerHTML;
    let total = document.getElementById("total").innerHTML;

    let idirishya = window.open("", "", "width=800,height=600");

    idirishya.document.write(`
    <html>
    <head>
    <title>Rapport Association</title>

    <style>
    body{
        font-family:Arial;
        padding:20px;
    }

    table{
        width:100%;
        border-collapse:collapse;
    }

    th,td{
        border:1px solid black;
        padding:8px;
    }

    </style>

    </head>

    <body>

    <h2>Rapport Association</h2>

    ${date}

    ${contenu}

    <h3>${total}</h3>

    </body>
    </html>
    `);

    idirishya.document.close();

    idirishya.print();

  }




// Button WhatsApp
function oherezaWhatsApp(){

    let ubutumwa = "Rapport y'ubwishyu\n\n";

    let amafarangaYose = 0;

    cotisations.forEach(function(m){

        ubutumwa += 
        "Izina: " + m.izina +
        "\nUkwezi: " + m.ukwezi +
        "\nAmafaranga: " + m.amafaranga + " Fbu\n\n";

        amafarangaYose += Number(m.amafaranga);

    });


    ubutumwa += 
    "Amafaranga yose hamwe: " + amafarangaYose + " Fbu";


    let numero = "25762277069";


    let url =
    "https://wa.me/" +
    numero +
    "?text=" +
    encodeURIComponent(ubutumwa);


    window.open(url, "_blank");

}
  // Guhitamwo role yo kugerageza

// hindura hano ugerageza:
// "vendeur"
// "president"
// "membre"


let role = "";

function permissions(){

// Funga buttons/formulaires
let hide = [
"produitPanel",
"depensePanel",
"cotisationPanel"
];


hide.forEach(function(id){

let element=document.getElementById(id);

if(element){
element.style.display="none";
}

});


// VENDEUR na PRESIDENT
if(role=="vendeur" || role=="president"){

document.getElementById("produitPanel").style.display="block";
document.getElementById("depensePanel").style.display="block";
document.getElementById("cotisationPanel").style.display="block";

}


// MEMBRE
else if(role=="membre"){

document.getElementById("membreRapport").style.display="block";

document.getElementById("rapportPanel").style.display="block";

}
}
  
  function connexion(){

let nom = document.getElementById("username").value.trim();
let pass = document.getElementById("password").value.trim();


if(nom === "vendeur" && pass === "1234"){

role = "vendeur";

}
else if(nom === "president" && pass === "5678"){

role = "president";

}
else if(nom === "membre" && pass === "0000"){

role = "membre";

}
else{

document.getElementById("message").innerHTML =
"Nom canke mot de passe si vyo";

return;

}


document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

permissions();

  }
                                   
  
</script>

</body>

</html>
